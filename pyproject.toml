[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fadewatch"
version = "0.1.0"
description = "Physics-informed early warning for satellite link fades, built on the Constellation API and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "sgp4>=2.22",
  "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.8"]
dev = ["pytest>=8"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.8", "pytest>=8"]

[project.scripts]
fadewatch = "fadewatch.cli:main"

[tool.setuptools]
packages = ["fadewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
