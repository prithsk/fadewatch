<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fadewatch</title>
<meta name="description" content="Sees satellite links fail before they do: a physics-informed early-warning agent replayed on Constellation's demo fleet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hud.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene" aria-label="Globe: ground stations, satellites and link beams"></canvas>
<div id="labels" class="layer"></div>
<svg id="overlay" class="layer" aria-hidden="true"><path id="leader"/></svg>
<div id="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="satbracket" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><span class="mark">Fadewatch</span><span class="live"><i></i>replay</span></div>
  <div class="modes" role="group" aria-label="Sensor look">
    <button data-mode="0" aria-pressed="true" title="Optical (1)">OPT</button>
    <button data-mode="1" aria-pressed="false" title="Thermal (2)">IR</button>
    <button data-mode="2" aria-pressed="false" title="Night vision (3)">NV</button>
  </div>
  <div class="clock"><span id="utc">--:--:--</span><small>UTC</small><span id="tplus"></span></div>
  <div class="transport">
    <button id="home" title="Whole fleet (Esc)" aria-label="Whole fleet"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c3 3.5 3 10.5 0 14M10 3c-3 3.5-3 10.5 0 14"/></svg></button>
    <button id="play" data-state="playing" title="Play / pause (Space)" aria-label="Play or pause"><svg viewBox="0 0 20 20"><path class="pz" d="M6 4h3v12H6zM11 4h3v12h-3z"/><path class="pl" d="M6 4l10 6-10 6z"/></svg></button>
    <button id="speed" title="Replay speed">40×</button>
    <button id="scorebtn" title="Backtest (S)">Score</button>
  </div>
</header>

<aside class="rail" aria-label="Predicted events">
  <div class="rail-h">Contacts</div>
  <ol id="contacts"></ol>
</aside>

<section id="target" class="card" aria-live="polite">
  <div class="c-head"><span id="t-code"></span><span id="t-tag"></span></div>
  <div id="t-sat" class="c-sat"></div>
  <div class="c-big"><span id="t-snr"></span><small id="t-unit">dB</small></div>
  <canvas id="t-chart"></canvas>
  <div class="c-key"><span><i class="k-fw"></i>Fadewatch</span><span><i class="k-pb"></i>persistence</span><span><i class="k-tr"></i>truth</span></div>
  <div class="c-stats">
    <div><span id="t-l1">margin</span><b id="t-margin"></b></div>
    <div><span id="t-l2">elev</span><b id="t-el"></b></div>
    <div><span id="t-l3">modcod</span><b id="t-mod"></b><em id="t-cap"></em></div>
  </div>
  <div class="c-lead"><span id="t-lead-l"></span><b id="t-lead"></b></div>
  <div id="t-act" class="c-act"></div>
</section>

<footer class="bottom">
  <div id="pools" class="pools" aria-label="Demand pools"></div>
  <button id="cl" aria-pressed="false" title="Show pool capacity with Fadewatch's plans executed">Plans</button>
  <canvas id="timeline" aria-label="Replay timeline"></canvas>
</footer>

<div id="kicker" aria-live="polite"></div>
<div id="score" class="score" role="dialog" aria-label="Backtest"></div>
<div id="boot"><div class="boot-mark">Fadewatch</div><div id="boot-msg">loading</div></div>

<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
